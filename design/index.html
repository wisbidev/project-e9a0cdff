<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Lab — Slow-roasted, small batch</title>
<style>
  :root {
    --cream: #FAF4E8;
    --card: #FFFDF7;
    --line: #EDE2CE;
    --brown: #2F2116;
    --brown-soft: #7C6350;
    --amber: #D97706;
    --amber-deep: #B45309;
    --amber-soft: #F6E3C4;
    --radius-lg: 24px;
    --radius-md: 16px;
    --shadow-soft: 0 10px 30px -12px rgba(47, 33, 22, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--brown);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  :focus-visible {
    outline: 3px solid var(--amber);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---------- Hero ---------- */

  .hero {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
  }

  .hero-inner {
    max-width: 760px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Coffee cup illustration */
  .cup {
    width: 108px;
    height: 108px;
    margin-bottom: 40px;
    animation: fade-up 0.9s ease-out both;
  }

  .cup .steam {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: steam 3.2s ease-in-out infinite;
  }
  .cup .steam.s2 { animation-delay: 0.55s; }
  .cup .steam.s3 { animation-delay: 1.1s; }

  @keyframes steam {
    0%   { opacity: 0; transform: translateY(10px) scaleY(0.85); }
    35%  { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-16px) scaleY(1.15); }
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(3rem, 9vw, 5.25rem);
    letter-spacing: -0.02em;
    line-height: 1.05;
    animation: fade-up 0.9s 0.12s ease-out both;
  }

  .subtitle {
    margin-top: 20px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: clamp(1.1rem, 2.6vw, 1.35rem);
    color: var(--brown-soft);
    animation: fade-up 0.9s 0.24s ease-out both;
  }

  .hero-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 48px;
    padding: 16px 34px;
    border: none;
    border-radius: 999px;
    background: var(--amber);
    color: #FFFDF7;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 8px 20px -10px rgba(217, 119, 6, 0.55);
    transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    animation: fade-up 0.9s 0.36s ease-out both;
  }

  .hero-btn:hover {
    background: var(--amber-deep);
    transform: translateY(-2px);
    box-shadow: 0 12px 26px -10px rgba(180, 83, 9, 0.55);
  }

  .hero-btn:active {
    transform: translateY(0);
  }

  .hero-btn .arrow {
    transition: transform 0.25s ease;
  }
  .hero-btn:hover .arrow {
    transform: translateY(3px);
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Menu ---------- */

  .menu {
    padding: 96px 24px 110px;
    display: flex;
    justify-content: center;
  }

  .menu-inner {
    max-width: 640px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 56px 48px;
  }

  .menu h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.9rem, 5vw, 2.4rem);
    text-align: center;
    letter-spacing: -0.01em;
  }

  .menu h2::after {
    content: "";
    display: block;
    width: 44px;
    height: 3px;
    border-radius: 999px;
    background: var(--amber);
    margin: 14px auto 0;
  }

  .menu-list {
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .drink {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    padding: 18px 22px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--cream);
    transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }

  .drink:hover {
    border-color: var(--amber-soft);
    transform: translateY(-2px);
    box-shadow: 0 8px 18px -12px rgba(47, 33, 22, 0.22);
  }

  .drink .name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.18rem;
    font-weight: 700;
  }

  .drink .dots {
    flex: 1;
    border-bottom: 2px dotted var(--line);
    transform: translateY(-4px);
    min-width: 24px;
  }

  .drink .price {
    font-weight: 600;
    color: var(--amber-deep);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 560px) {
    .menu { padding: 64px 16px 80px; }
    .menu-inner { padding: 40px 24px; }
    .hero { padding: 48px 20px; }
    .cup { width: 88px; height: 88px; margin-bottom: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .cup .steam,
    .cup,
    h1,
    .subtitle,
    .hero-btn,
    .drink { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <!-- ============ Hero ============ -->
  <section class="hero" id="top">
    <div class="hero-inner">
      <div class="cup" aria-hidden="true">
        <svg viewBox="0 0 108 108" width="108" height="108" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- steam -->
          <path class="steam s1" d="M42 22 C40 16 45 14 43 8" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
          <path class="steam s2" d="M55 24 C53 18 58 16 56 10" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
          <path class="steam s3" d="M68 22 C66 16 71 14 69 8" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
          <!-- cup body -->
          <path d="M34 34 H74 L70 76 A6 6 0 0 1 64 81 H44 A6 6 0 0 1 38 76 Z" fill="#FFFDF7" stroke="#2F2116" stroke-width="4" stroke-linejoin="round"/>
          <!-- coffee surface -->
          <path d="M38 44 H70 L68 52 H40 Z" fill="#2F2116" opacity="0.85"/>
          <!-- saucer -->
          <rect x="28" y="84" width="52" height="7" rx="3.5" fill="#2F2116" opacity="0.9"/>
          <!-- handle -->
          <path d="M74 44 C88 44 90 62 76 66" stroke="#2F2116" stroke-width="4" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <h1>Coffee Lab</h1>
      <p class="subtitle">Slow-roasted, small batch</p>
      <a class="hero-btn" href="#menu">
        See the menu
        <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 2v11M3 9l5 5 5-5" stroke="#FFFDF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </section>

  <!-- ============ Menu ============ -->
  <section class="menu" id="menu">
    <div class="menu-inner">
      <h2>Menu</h2>
      <div class="menu-list">
        <div class="drink">
          <span class="name">Espresso</span>
          <span class="dots" aria-hidden="true"></span>
          <span class="price">45k</span>
        </div>
        <div class="drink">
          <span class="name">Latte</span>
          <span class="dots" aria-hidden="true"></span>
          <span class="price">55k</span>
        </div>
        <div class="drink">
          <span class="name">Cold Brew</span>
          <span class="dots" aria-hidden="true"></span>
          <span class="price">60k</span>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
